# Test profile for integration tests (*IT.java) running against PostgreSQL Testcontainers.
# Datasource url / credentials are injected at runtime via DynamicPropertySource,
# so they are intentionally NOT set here.

casehub:
  bootstrap:
    admin-password: ""
  security:
    cors:
      allowed-origins: []
    proxy:
      trusted-proxies:
        - 127.0.0.1
        - ::1

spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true
