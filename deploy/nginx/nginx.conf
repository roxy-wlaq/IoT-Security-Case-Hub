# =============================================================================
# CaseHub Nginx 主配置
#
# 安全基线来源：Security-RBAC-Detail V1.0 第 83-84 节
# 限流基线来源：Security-RBAC-Detail V1.0 第 90-91 节
# 上传/超时基线来源：Deployment-Backup V1.0 第 16-17 节
#
# 注意：nginx 的 add_header 继承规则 ——
#   子级（server / location）一旦出现任意 add_header，
#   父级（http）的 add_header 会被全部丢弃。
#   因此在 deploy/nginx/conf.d/casehub.conf 中使用 add_header 的 location
#   必须重复声明安全头，已在对应位置加注释说明。
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time '
                      'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 不暴露 nginx 版本号
    server_tokens off;

    # -------------------------------------------------------------------------
    # 上传大小基线：100m
    #
    # Deployment-Backup V1.0 第 16 节建议 Evidence 场景 500m。
    # V1 Phase 1 先按 100m 作为保守基线。
    # 如需放开，三处必须同时调整，否则会出现 Nginx 413 或后端报错：
    #   1) 本文件的 client_max_body_size
    #   2) .env 中的 CASEHUB_MAX_FILE_SIZE
    #   3) 后端 spring.servlet.multipart.max-file-size / max-request-size
    # -------------------------------------------------------------------------
    client_max_body_size 100m;

    client_body_timeout    60s;
    client_header_timeout  60s;
    send_timeout           60s;

    # -------------------------------------------------------------------------
    # gzip 压缩
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-excel
        image/svg+xml;

    # -------------------------------------------------------------------------
    # 限流：登录接口 每 IP 10 次/分钟，突发 5（Security 文档第 91 节）
    # 应用层仍需实现 username 失败锁定，这里只防明显的异常请求。
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    upstream casehub_backend {
        server backend:8080;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
