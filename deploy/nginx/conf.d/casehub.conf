# =============================================================================
# CaseHub 站点配置
#
# 生产容器只有 nginx / backend / postgres（Final Technical Review 第 4 节）。
# Nginx 是唯一外部入口（Deployment 文档第 9 节）。
#
# 关于 proxy_pass 是否去掉 /api 前缀：
#   后端 Spring Security 的匹配规则写作 /api/v1/**（见 Security 文档第 216 行、
#   Testing Strategy 第 59 节），说明 backend 容器内部看到的路径就是 /api/v1/...。
#   因此这里 proxy_pass 不带 URI 部分，保留原始请求路径，不做前缀剥离。
#   如果后续 backend 配置了 server.servlet.context-path=/api，
#   则必须改成 `proxy_pass http://casehub_backend/;`（带尾斜杠）以剥离 /api。
# =============================================================================

upstream casehub_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # React SPA：路由 fallback（Deployment 文档第 13 节）
    # 本 location 不使用 add_header，继承 http 级安全头。
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须 no-cache，否则升级后浏览器仍引用旧 asset
    # （Deployment 文档第 18 节）。用 expires 而非 add_header，避免破坏继承。
    location = /index.html {
        expires -1;
    }

    # Vite 带 hash 的构建产物：长缓存
    # nginx add_header 继承规则：本 location 一旦使用 add_header，
    # http 级安全头会被丢弃，因此这里重复声明一份。
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # API 反向代理（Deployment 文档第 14-15 节）
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://casehub_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Evidence 上传 / 下载 / Excel 导出可能较慢。
        # Deployment 文档第 17 节建议 300s；内网链路稳定时可下调至 120s。
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
        proxy_request_buffering off;

        # Spring Security 默认也会输出 X-Frame-Options / X-Content-Type-Options，
        # 这里隐藏后端副本，避免与 nginx 安全头重复。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # -------------------------------------------------------------------------
    # 登录限流（Security 文档第 91 节）：每 IP 10 次/分钟，突发 5，超出返回 429
    # zone 定义在 deploy/nginx/nginx.conf 的 http 块。
    # -------------------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://casehub_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # -------------------------------------------------------------------------
    # Actuator 健康检查（Deployment 文档第 26 节）
    # Spring Boot 默认只暴露 status，不含敏感信息。
    # 如生产不希望外部访问，注释掉本块即可。
    # -------------------------------------------------------------------------
    location /actuator/ {
        proxy_pass http://casehub_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # -------------------------------------------------------------------------
    # Nginx 自身健康检查（Deployment 文档第 30-31 节）
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # Evidence / 上传文件严禁由 nginx 静态暴露（Deployment 文档第 19 节）。
    # 所有文件读写必须经过后端 Authorization。
    # 因此这里不配置任何 /evidence/、/files/ 之类的静态映射。
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # HTTPS 预留（Deployment 文档第 10-12 节）
    #
    # 启用步骤：
    #   1) 把证书放到宿主机 /srv/casehub/certs/
