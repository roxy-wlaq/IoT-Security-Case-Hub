    #          - /srv/casehub/certs:/etc/nginx/certs:ro
    #        ports:
    #          - "${HTTPS_PORT:-443}:443"
    #   3) 取消下面 server 块的注释，并把上面 HTTP server 改为 301 跳转
    #
    # 证书私钥禁止提交到 Git（Deployment 文档第 136-137 节）。
    # -------------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    #
    #     server_name casehub.company.local;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
